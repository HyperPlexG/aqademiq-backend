# Local dev dependencies for the Aqademiq backend.
# Matches the defaults in .env.example (Postgres 5432 / Redis 6379).
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop + wipe data
services:
  postgres:
    image: postgres:16
    container_name: aqademiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: aqademiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: aqademiq-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
