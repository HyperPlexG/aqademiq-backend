name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # Workload Identity Federation (keyless GCP auth)
  contents: read

jobs:
  # ---- CI: runs on every push + PR, no GCP needed (free) ----
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run build
      # Export the OpenAPI contract as a build artifact (handoff to the app team).
      - name: Generate OpenAPI spec
        run: EMIT_OPENAPI=1 timeout 60 node dist/main.js || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: ignore
      # TODO: add `npm test` (jest) and `npm run lint` (eslint) once those
      # devDependencies are added — currently not installed.

  # ---- CD: deploy to Cloud Run on main (needs the paid GCP project) ----
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_SQL_CONNECTION: ${{ vars.CLOUD_SQL_CONNECTION }}
      REDIS_HOST: ${{ vars.REDIS_HOST }}
      REDIS_PORT: ${{ vars.REDIS_PORT }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/aqademiq-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate deploy configuration
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: |
          test -n "$GCP_PROJECT" || (echo "Missing vars.GCP_PROJECT_ID" && exit 1)
          test -n "$GCP_REGION" || (echo "Missing vars.GCP_REGION" && exit 1)
          test -n "$CLOUD_RUN_SERVICE" || (echo "Missing vars.CLOUD_RUN_SERVICE" && exit 1)
          test -n "$CLOUD_SQL_CONNECTION" || (echo "Missing vars.CLOUD_SQL_CONNECTION" && exit 1)
          test -n "$REDIS_HOST" || (echo "Missing vars.REDIS_HOST" && exit 1)
          test -n "$REDIS_PORT" || (echo "Missing vars.REDIS_PORT" && exit 1)
          test -n "$DATABASE_URL_MIGRATE" || (echo "Missing secrets.DATABASE_URL_MIGRATE" && exit 1)
          [ "$CLOUD_SQL_CONNECTION" != "project:region:instance" ] || (echo "Replace placeholder CLOUD_SQL_CONNECTION value" && exit 1)

      # Migrations run once before rollout (single owner).
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run Prisma migrations through Cloud SQL Auth Proxy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: |
          curl -fsSL -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 "$CLOUD_SQL_CONNECTION" &
          PROXY_PID=$!
          trap "kill $PROXY_PID" EXIT
          sleep 5
          set +e
          MIGRATE_OUTPUT="$(npx prisma migrate deploy 2>&1)"
          MIGRATE_STATUS=$?
          set -e
          echo "$MIGRATE_OUTPUT"
          if [ "$MIGRATE_STATUS" -ne 0 ]; then
            if echo "$MIGRATE_OUTPUT" | python -c "import sys; sys.exit(0 if 'P3005' in sys.stdin.read() else 1)"; then
              echo "Detected existing schema (P3005). Baselining Prisma migrations."
              for migration_path in prisma/migrations/*; do
                migration_name="$(basename "$migration_path")"
                if [ "$migration_name" = "migration_lock.toml" ]; then
                  continue
                fi
                npx prisma migrate resolve --applied "$migration_name"
              done
              npx prisma migrate deploy
            else
              exit "$MIGRATE_STATUS"
            fi
          fi

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build & push image
        run: gcloud builds submit --tag "$IMAGE" --region "$GCP_REGION" --suppress-logs

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --service-account "aqademiq-runner@$GCP_PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$CLOUD_SQL_CONNECTION" \
            --set-env-vars "NODE_ENV=production,GCP_PROJECT_ID=$GCP_PROJECT,GCP_REGION=$GCP_REGION,REDIS_HOST=$REDIS_HOST,REDIS_PORT=$REDIS_PORT" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify health endpoint
        run: |
          curl -fsSL "${{ steps.deploy.outputs.service_url }}/v1/healthz" > healthz.json
          python -c "import json; d=json.load(open('healthz.json')); assert d.get('status') == 'ok', d"
