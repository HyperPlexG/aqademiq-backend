name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the api edge function to Supabase after CI passes'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---- NestJS reference backend: Prisma + lint + tests + build + OpenAPI ----
  backend:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate`/`validate` resolve the datasource env
      # (no DB is contacted). The real URLs live in Supabase secrets, not CI.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails if the committed contract is missing the edge-only endpoints or has
      # drifted between its copies. The frontend repo isn't checked out here, so
      # that copy is reported as skipped rather than failing the job.
      - name: Check the OpenAPI contract is merged and in sync
        run: npm run openapi:check
      # Export the OpenAPI contract as a build artifact (handoff to the app team).
      - name: Generate OpenAPI spec
        run: EMIT_OPENAPI=1 timeout 60 node dist/main.js || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: ignore

  # ---- Supabase Edge Functions (the deployed target): type-check under Deno ----
  edge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Emits the Deno edge client into supabase/functions/_shared/prisma.
      - run: npx prisma generate
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check api/index.ts prisma-spike/index.ts
      # Unit tests for the pure logic under supabase/functions/ — jest only covers
      # the NestJS reference in src/, so without this the edge tree has no test
      # gate at all. Currently the free/busy arithmetic, where a wrong answer is
      # silent: it reports a slot as free that is already booked.
      - name: Test edge functions
        working-directory: supabase/functions
        run: deno test --allow-env api/

  # ---- Deploy the api edge function ----
  # Runs on every push to main once `backend` + `edge` are green (a `needs` job
  # that fails or is skipped stops this one), and on demand from the Actions tab
  # → "ci" → "Run workflow" → tick `deploy`. Pull requests never deploy.
  #
  # NOTE: main is deployed straight to production — there is no staging project.
  # Anything merged to main is live as soon as CI passes.
  # Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
  deploy:
    needs: [backend, edge]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qwvuoooentacjslzpbqy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Emits the Deno edge client into supabase/functions/_shared/prisma — the
      # function will not boot without it, and it is not committed to the repo.
      - run: npx prisma generate
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: the FUNCTION owns auth (Supabase JWKS guard) and keeps
      # /healthz + /readyz public. Mirrors docs/DEPLOY_EDGE_INDIA.md.
      # --use-api bundles server-side through the Management API instead of the
      # local Docker edge-runtime image. The Docker bundler embeds the source
      # maps of every npm dependency it pulls, and @prisma/client's runtime maps
      # alone are ~1 MB; that pushed the script past the 20 MiB ceiling at
      # "21 MB" on a change of ~25 KB of source, because the previous deploy was
      # already sitting at ~19.9 MiB. The graph itself has no slack left to cut:
      # it resolves exactly one query compiler (postgresql), one driver, hono
      # and jose.
      - name: Deploy api
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

# prisma-spike is unchanged and intentionally not deployed here; deploy it with the
# CLI if it ever needs updating — see docs/DEPLOY_EDGE_INDIA.md.
