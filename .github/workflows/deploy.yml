name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- NestJS reference backend: Prisma + lint + tests + build + OpenAPI ----
  backend:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate`/`validate` resolve the datasource env
      # (no DB is contacted). The real URLs live in Supabase secrets, not CI.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Export the OpenAPI contract as a build artifact (handoff to the app team).
      - name: Generate OpenAPI spec
        run: EMIT_OPENAPI=1 timeout 60 node dist/main.js || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: ignore

  # ---- Supabase Edge Functions (the deployed target): type-check under Deno ----
  edge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Emits the Deno edge client into supabase/functions/_shared/prisma.
      - run: npx prisma generate
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check api/index.ts prisma-spike/index.ts

# Deployment is by the Supabase CLI (`supabase functions deploy api prisma-spike
# --project-ref qwvuoooentacjslzpbqy`), not GitHub Actions — see
# docs/DEPLOY_EDGE_INDIA.md. The legacy Cloud Run CD was removed at the edge cutover.
