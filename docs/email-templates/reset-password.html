<!-- Supabase → Authentication → Emails → "Reset password" → Body (Source).
     Requires custom SMTP to be enabled first. Aqademiq brand: #6B5CF0 purple + white. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background:#F5F2FF;">
  <tr>
    <td align="center" style="padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px;max-width:100%;background:#FFFFFF;border-radius:16px;border:1px solid #EDEAFD;overflow:hidden;">
        <tr>
          <td style="height:6px;background:#6B5CF0;line-height:6px;font-size:6px;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:32px 36px 8px;">
            <div style="font-size:22px;font-weight:800;color:#6B5CF0;letter-spacing:-0.5px;">Aqademiq</div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 36px 0;">
            <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#1A1626;">Reset your password</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#4B4B57;">
              Enter this code in the app to set a new password.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 36px;">
            <div style="background:#EDEAFD;border-radius:12px;padding:20px;text-align:center;">
              <div style="font-size:34px;font-weight:800;letter-spacing:10px;color:#6B5CF0;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 36px 36px;">
            <p style="margin:0;font-size:13px;line-height:1.5;color:#8A8794;">
              This code expires in 1 hour. If you didn't request a password reset, you can safely ignore this email — your password won't change.
            </p>
          </td>
        </tr>
      </table>
      <div style="margin-top:16px;font-size:12px;color:#A7A4B0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        © Aqademiq · Study, focused.
      </div>
    </td>
  </tr>
</table>
